# Repo 3: Payment Service (Port 8083)
server.port=8083
spring.application.name=repo3-payment-service

# PostgreSQL Database Configuration (Points to the same PostgreSQL database)
spring.datasource.url=jdbc:postgresql://localhost:5432/shared_app_db
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
